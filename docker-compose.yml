# Proyecto 309 — Infra local (Odoo Community 17 + PostgreSQL 15)
# Uso: docker compose up -d

services:
  db:
    image: postgres:15-alpine
    container_name: p309-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  odoo:
    image: odoo:17.0
    container_name: p309-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
